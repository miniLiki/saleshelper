services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: saleshelper
      POSTGRES_USER: saleshelper
      POSTGRES_PASSWORD: saleshelper
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleshelper -d saleshelper"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      GRPC_DNS_RESOLVER: native
      GODEBUG: netdns=go
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  neo4j:
    image: neo4j:5.26
    command: ["neo4j", "console"]
    environment:
      NEO4J_AUTH: neo4j/saleshelper
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://saleshelper:saleshelper@postgres:5432/saleshelper
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - milvus
      - neo4j

  worker:
    build:
      context: ../backend
    env_file:
      - ../.env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg2://saleshelper:saleshelper@postgres:5432/saleshelper
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  neo4j_data:
